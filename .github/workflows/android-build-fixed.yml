name: Build Android App Fixed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build-fixed.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original Android signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/11018538690/zip \
            > signing-backup.zip

          mkdir -p signing-backup
          unzip -q signing-backup.zip -d signing-backup

          cp signing-backup/android.keystore android.keystore

          STORE_PASS="$(awk -F': ' '/Keystore password:/{print $2}' signing-backup/SADIQ-SIGNING-CREDENTIALS.txt | tr -d '\r\n')"
          KEY_PASS="$(awk -F': ' '/Key password:/{print $2}' signing-backup/SADIQ-SIGNING-CREDENTIALS.txt | tr -d '\r\n')"

          test -n "$STORE_PASS"
          test -n "$KEY_PASS"

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          keytool -list -v \
            -keystore android.keystore \
            -storepass "$STORE_PASS" \
            -alias sadiq \
            | grep "SHA256:" \
            | grep -q "13:EA:84:B7:A1:9C:82:BE:C9:40:15:9F:7A:19:75:E8:3F:08:CB:E6:83:8D:C2:E7:12:6B:F9:3D:BE:82:EE:8B"

      - name: Build Android app with original signing identity
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint /bin/bash \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -e BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            -lc '
              set -euo pipefail

              SDK_ROOT="/root/.bubblewrap/android_sdk"

              bubblewrap update --skipVersionUpgrade --manifest=/workspace/twa-manifest.json

              SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
              test -n "$SDKMANAGER"

              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
                "build-tools;35.0.0" \
                "platforms;android-36"

              bubblewrap build \
                --skipPwaValidation \
                --manifest=/workspace/twa-manifest.json \
                --signingKeyPath=/workspace/android.keystore \
                --signingKeyAlias=sadiq
            '

      - name: Verify and collect fixed release
        shell: bash
        run: |
          set -euo pipefail

          test -f app-release-signed.apk
          test -f app-release-bundle.aab

          jarsigner -verify -strict app-release-signed.apk
          jarsigner -verify -strict app-release-bundle.aab

          mkdir -p release
          cp app-release-signed.apk release/Sadiq-Android-v1.0.0-FIXED.apk
          cp app-release-bundle.aab release/Sadiq-Google-Play-v1.0.0.aab
          cp android.keystore release/android.keystore
          cp signing-backup/SADIQ-SIGNING-CREDENTIALS.txt release/SADIQ-SIGNING-CREDENTIALS.txt

          sha256sum \
            release/Sadiq-Android-v1.0.0-FIXED.apk \
            release/Sadiq-Google-Play-v1.0.0.aab \
            > release/SHA256SUMS.txt

      - name: Upload fixed Android release
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-android-fixed-release
          path: release/
          if-no-files-found: error
          retention-days: 30
