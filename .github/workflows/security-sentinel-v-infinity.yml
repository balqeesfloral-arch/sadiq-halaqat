name: Sadiq Security Sentinel V Infinity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-audit:
    name: Core security audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p security-artifacts

      - name: Sadiq Sentinel static audit
        continue-on-error: true
        run: npm run security:sentinel

      - name: Repository secret and source hygiene
        run: npm run security:scan

      - name: Dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --json > security-artifacts/npm-audit.json

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production artifact security scan
        run: npm run security:dist

      - name: Live production surface scan
        continue-on-error: true
        env:
          SECURITY_TARGET_URL: https://sadiqh.vercel.app
        run: npm run security:live

      - name: Write job summary
        if: always()
        run: |
          echo "# Sadiq Security Sentinel V Infinity" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f security-artifacts/sentinel-report.md ]; then
            cat security-artifacts/sentinel-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f security-artifacts/live-scan.md ]; then
            cat security-artifacts/live-scan.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create clean source snapshot
        if: always()
        run: |
          mkdir -p security-artifacts/source
          rsync -a             --exclude='.git'             --exclude='node_modules'             --exclude='dist'             --exclude='security-artifacts'             ./ security-artifacts/source/
          cd security-artifacts
          zip -qr sadiq-security-v-infinity-source.zip source
          rm -rf source

      - name: Upload core audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-security-v-infinity-core-${{ github.run_number }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

  semgrep:
    name: Deep SAST with Semgrep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep
        continue-on-error: true
        run: |
          mkdir -p security-artifacts
          semgrep scan             --config auto             --exclude node_modules             --exclude dist             --exclude security-artifacts             --json             --output security-artifacts/semgrep.json             .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-security-v-infinity-semgrep-${{ github.run_number }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

  supabase-lint:
    name: Optional live Supabase database lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p security-artifacts

      - name: Run Supabase lint when secrets are configured
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            printf '%s\n'               '# Supabase live lint'               ''               'Skipped: configure SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_REF as GitHub Actions secrets.'               > security-artifacts/supabase-live-lint.md
            exit 0
          fi

          npx --yes supabase@latest link             --project-ref "$SUPABASE_PROJECT_REF"             --password "$SUPABASE_DB_PASSWORD"

          npx --yes supabase@latest db lint             --linked             --level warning             > security-artifacts/supabase-db-lint.txt 2>&1 || true

      - name: Upload Supabase lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-security-v-infinity-supabase-${{ github.run_number }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

  zap-baseline:
    name: Safe OWASP ZAP baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run passive/baseline web scan
        continue-on-error: true
        run: |
          mkdir -p security-artifacts/zap
          chmod 777 security-artifacts/zap
          docker run --rm             -v "$PWD/security-artifacts/zap:/zap/wrk/:rw"             -t ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py             -t https://sadiqh.vercel.app             -J zap-report.json             -r zap-report.html             -w zap-report.md             -I || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-security-v-infinity-zap-${{ github.run_number }}
          path: security-artifacts/zap/
          if-no-files-found: warn
          retention-days: 30
