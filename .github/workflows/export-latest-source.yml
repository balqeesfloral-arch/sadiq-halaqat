name: Export Legendary Sadiq Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-latest-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Prepare clean verified source backup
        shell: bash
        run: |
          set -euo pipefail

          ROOT="export/Sadiq-Halaqat-LEGENDARY"
          mkdir -p "$ROOT"

          rsync -a ./ "$ROOT/" \
            --exclude '.git/' \
            --exclude 'export/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '*.keystore' \
            --exclude '*.jks' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.env.development.local' \
            --exclude '.env.production.local'

          cat > "$ROOT/BACKUP_INFO.txt" <<EOF
          Project: الصديق - نظام إدارة الحلقات
          Repository: ${{ github.repository }}
          Branch: main
          Commit: ${{ github.sha }}
          Exported: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Verification: npm ci + npm run build = SUCCESS

          Included:
          - Latest production source from GitHub main
          - Refined landing design and premium surfaces
          - Per-student memorized revision scope and cyclic review logic
          - PWA / background notifications / passkeys
          - Supabase migrations and Edge Functions
          - Android/TWA project configuration

          Excluded intentionally:
          - node_modules and dist
          - local environment files
          - Android signing keys
          - private secrets
          EOF

          cd export
          zip -r -9 Sadiq-Halaqat-LEGENDARY-v2026.09.29.zip Sadiq-Halaqat-LEGENDARY >/dev/null
          sha256sum Sadiq-Halaqat-LEGENDARY-v2026.09.29.zip > SHA256SUMS.txt

      - name: Upload verified source backup
        uses: actions/upload-artifact@v4
        with:
          name: Sadiq-Halaqat-LEGENDARY-v2026.09.29
          path: |
            export/Sadiq-Halaqat-LEGENDARY-v2026.09.29.zip
            export/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
