name: Build Android App v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 16)"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore android.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias sadiq \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sadiq, OU=Sadiq, O=Sadiq Halaqat, L=Makkah, ST=Makkah, C=SA"
          mkdir -p release
          printf '%s\n' \
            "Package: app.sadiq.halaqat" \
            "Alias: sadiq" \
            "Keystore password: $STORE_PASS" \
            "Key password: $STORE_PASS" \
            > release/SADIQ-SIGNING-CREDENTIALS.txt

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update --skipVersionUpgrade --manifest=/workspace/twa-manifest.json

      - name: Build signed Android files
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -e BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build --skipPwaValidation \
              --manifest=/workspace/twa-manifest.json \
              --signingKeyPath=/workspace/android.keystore \
              --signingKeyAlias=sadiq

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          cp android.keystore release/android.keystore
          AAB="$(find . -type f -name "*.aab" | head -n 1)"
          APK="$(find . -type f -name "*signed*.apk" | head -n 1)"
          ASSETLINKS="$(find . -type f -name "assetlinks.json" | head -n 1 || true)"
          cp "$AAB" release/sadiq-play-release.aab
          cp "$APK" release/sadiq-android-release.apk
          if [ -n "$ASSETLINKS" ]; then cp "$ASSETLINKS" release/assetlinks.json; fi
          sha256sum release/sadiq-play-release.aab release/sadiq-android-release.apk > release/SHA256SUMS.txt

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-android-release-v2
          path: release/
          retention-days: 30
