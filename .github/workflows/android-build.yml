name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -base64 36 | tr -d '\n/=+' | cut -c1-28)"
          KEY_PASS="$STORE_PASS"

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias sadiq \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sadiq, OU=Sadiq, O=Sadiq Halaqat, L=Makkah, ST=Makkah, C=SA"

          {
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          mkdir -p release
          cat > release/SADIQ-SIGNING-CREDENTIALS.txt <<EOF
          Sadiq Android signing backup
          ============================
          Package: app.sadiq.halaqat
          Alias: sadiq
          Keystore password: $STORE_PASS
          Key password: $KEY_PASS

          IMPORTANT:
          Keep android.keystore and this password file together in a secure backup.
          Future Google Play updates must use the same signing key unless Play App Signing handles the upgrade path.
          EOF

      - name: Generate Android Trusted Web Activity project
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update --skipVersionUpgrade --manifest=/workspace/twa-manifest.json

      - name: Build signed APK and App Bundle
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -e BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build \
              --skipPwaValidation \
              --manifest=/workspace/twa-manifest.json \
              --signingKeyPath=/workspace/android.keystore \
              --signingKeyAlias=sadiq

      - name: Collect Android release
        shell: bash
        run: |
          set -euo pipefail
          cp android.keystore release/android.keystore
          find . -maxdepth 3 -type f \( -name "*.aab" -o -name "*signed*.apk" -o -name "assetlinks.json" \) -print

          AAB="$(find . -type f -name "*.aab" | head -n 1 || true)"
          APK="$(find . -type f -name "*signed*.apk" | head -n 1 || true)"
          ASSETLINKS="$(find . -type f -name "assetlinks.json" | head -n 1 || true)"

          test -n "$AAB"
          test -n "$APK"

          cp "$AAB" release/sadiq-play-release.aab
          cp "$APK" release/sadiq-android-release.apk

          if [ -n "$ASSETLINKS" ]; then
            cp "$ASSETLINKS" release/assetlinks.json
          fi

          sha256sum release/sadiq-play-release.aab release/sadiq-android-release.apk > release/SHA256SUMS.txt

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-android-release
          path: release/
          if-no-files-found: error
          retention-days: 30
