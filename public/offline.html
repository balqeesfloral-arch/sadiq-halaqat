<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F4C45" />
  <title>الصديق • بدون اتصال</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173f37;background:#f5f2e9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 10%,rgba(201,163,67,.13),transparent 27%),radial-gradient(circle at 10% 90%,rgba(15,76,69,.12),transparent 30%),linear-gradient(135deg,#f5f1e7,#fbfaf5 48%,#edf4ef)}
    main{width:min(520px,100%);padding:34px;border:1px solid rgba(15,76,69,.12);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 28px 80px rgba(8,47,42,.13);text-align:center}
    img{width:84px;height:84px;object-fit:contain}h1{margin:18px 0 8px;font-size:28px}p{margin:0;color:#6e7e78;line-height:1.9;font-weight:600}
    button{margin-top:22px;min-height:46px;padding:0 20px;border:0;border-radius:14px;background:linear-gradient(135deg,#082f2a,#0f4c45);color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="الصديق" />
    <h1>الاتصال غير متوفر حاليًا</h1>
    <p>احتفظنا بالواجهة الأساسية على جهازك. عندما يعود الاتصال يمكنك متابعة العمل مباشرة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
