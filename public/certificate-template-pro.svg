<svg xmlns="http://www.w3.org/2000/svg" width="3508" height="2480" viewBox="0 0 3508 2480">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.55" stop-color="#fffefb"/>
      <stop offset="1" stop-color="#f7fbf8"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="50%" cy="4%" r="52%">
      <stop offset="0" stop-color="#d5b34e" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#d5b34e" stop-opacity=".035"/>
      <stop offset="1" stop-color="#d5b34e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottom" cx="50%" cy="100%" r="50%">
      <stop offset="0" stop-color="#0f6b5d" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0f6b5d" stop-opacity="0"/>
    </radialGradient>

    <pattern id="paper" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.25" fill="#0f6b5d" opacity=".018"/>
      <circle cx="31" cy="23" r="1" fill="#c6a844" opacity=".02"/>
      <path d="M0 45 L45 0" stroke="#0f6b5d" stroke-width=".6" opacity=".008"/>
    </pattern>

    <pattern id="starPattern" width="150" height="150" patternUnits="userSpaceOnUse">
      <g transform="translate(75 75)" opacity=".05">
        <path d="M0,-42 L12,-18 L40,-16 L20,3 L27,31 L0,18 L-27,31 L-20,3 L-40,-16 L-12,-18 Z"
              fill="none" stroke="#0f6b5d" stroke-width="2"/>
        <circle r="11" fill="none" stroke="#c8a846" stroke-width="1.7"/>
      </g>
    </pattern>

    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e6d1b"/>
      <stop offset=".34" stop-color="#e4cd78"/>
      <stop offset=".52" stop-color="#b28e2e"/>
      <stop offset=".75" stop-color="#f2df9a"/>
      <stop offset="1" stop-color="#92701d"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0a312c" flood-opacity=".08"/>
    </filter>

    <g id="cornerOrnament">
      <path d="M0 240 L0 0 L240 0" fill="none" stroke="#0d5147" stroke-width="18"/>
      <path d="M18 210 L18 18 L210 18" fill="none" stroke="url(#goldStroke)" stroke-width="7"/>
      <path d="M46 190 L46 46 L190 46" fill="none" stroke="#0f6b5d" stroke-width="3" opacity=".78"/>
      <path d="M70 70 L135 70 L168 103 L168 168 L103 168 L70 135 Z"
            fill="none" stroke="url(#goldStroke)" stroke-width="5" opacity=".92"/>
      <path d="M93 93 L145 93 L145 145 L93 145 Z"
            fill="none" stroke="#0f6b5d" stroke-width="3" transform="rotate(45 119 119)" opacity=".7"/>
      <circle cx="119" cy="119" r="15" fill="none" stroke="#c8a846" stroke-width="3"/>
    </g>

    <g id="sideFlourish">
      <path d="M0 0 C45 35 75 90 75 145 C75 198 45 252 0 286"
            fill="none" stroke="#0f6b5d" stroke-width="4" opacity=".22"/>
      <path d="M10 18 C48 54 60 100 60 145 C60 190 48 235 10 268"
            fill="none" stroke="#c7a842" stroke-width="3" opacity=".25"/>
      <circle cx="58" cy="145" r="12" fill="none" stroke="#c7a842" stroke-width="3" opacity=".34"/>
    </g>
  </defs>

  <rect width="3508" height="2480" fill="url(#ivory)"/>
  <rect width="3508" height="2480" fill="url(#paper)"/>
  <rect width="3508" height="2480" fill="url(#glowTop)"/>
  <rect width="3508" height="2480" fill="url(#glowBottom)"/>

  <!-- quiet center pattern -->
  <rect x="555" y="330" width="2398" height="1650" fill="url(#starPattern)" opacity=".28"/>

  <!-- outer architecture -->
  <rect x="66" y="66" width="3376" height="2348" rx="12"
        fill="none" stroke="#0b443b" stroke-width="18"/>
  <rect x="92" y="92" width="3324" height="2296" rx="9"
        fill="none" stroke="url(#goldStroke)" stroke-width="5"/>
  <rect x="116" y="116" width="3276" height="2248" rx="6"
        fill="none" stroke="#0f6b5d" stroke-width="2" opacity=".8"/>

  <!-- corners -->
  <g transform="translate(66 66)"><use href="#cornerOrnament"/></g>
  <g transform="translate(3442 66) scale(-1 1)"><use href="#cornerOrnament"/></g>
  <g transform="translate(66 2414) scale(1 -1)"><use href="#cornerOrnament"/></g>
  <g transform="translate(3442 2414) scale(-1 -1)"><use href="#cornerOrnament"/></g>

  <!-- side flourishes -->
  <g transform="translate(145 1000)"><use href="#sideFlourish"/></g>
  <g transform="translate(3363 1000) scale(-1 1)"><use href="#sideFlourish"/></g>

  <!-- top central crown -->
  <g transform="translate(1754 185)">
    <path d="M-330 0 H-95" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <path d="M95 0 H330" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-85 0 L0 -58 L85 0 L0 58 Z"
          fill="#fffdf8" stroke="url(#goldStroke)" stroke-width="5"/>
    <path d="M-42 0 L0 -28 L42 0 L0 28 Z"
          fill="none" stroke="#0f6b5d" stroke-width="4"/>
    <circle r="8" fill="#c7a842"/>
  </g>

  <!-- logo medallion placeholder -->
  <g transform="translate(1754 350)" filter="url(#softShadow)">
    <circle r="84" fill="#fffdfa" stroke="#0b4a40" stroke-width="6"/>
    <circle r="70" fill="none" stroke="url(#goldStroke)" stroke-width="4"/>
    <circle r="53" fill="#f4faf6" stroke="#0f6b5d" stroke-width="2" opacity=".95"/>
  </g>

  <!-- title separator area -->
  <g transform="translate(1754 635)">
    <path d="M-275 0 H-75" stroke="#0f6b5d" stroke-width="3" opacity=".5"/>
    <path d="M75 0 H275" stroke="#0f6b5d" stroke-width="3" opacity=".5"/>
    <path d="M-58 0 L0 -28 L58 0 L0 28 Z" fill="#fffdf8" stroke="#c7a842" stroke-width="3"/>
    <circle r="6" fill="#0f6b5d"/>
  </g>

  <!-- center watermark medallion -->
  <g transform="translate(1754 1320)" opacity=".028">
    <circle r="440" fill="none" stroke="#0f6b5d" stroke-width="18"/>
    <circle r="340" fill="none" stroke="#c7a842" stroke-width="12"/>
    <path d="M0,-385 L80,-190 L280,-280 L190,-80 L385,0 L190,80 L280,280 L80,190 L0,385 L-80,190 L-280,280 L-190,80 L-385,0 L-190,-80 L-280,-280 L-80,-190 Z"
          fill="none" stroke="#0f6b5d" stroke-width="18"/>
  </g>

  <!-- score cradle -->
  <g transform="translate(1754 1808)" opacity=".9">
    <path d="M-405 0 C-250 75 -110 90 0 90 C110 90 250 75 405 0"
          fill="none" stroke="#c7a842" stroke-width="4" opacity=".5"/>
    <path d="M-205 66 H205" fill="none" stroke="#0f6b5d" stroke-width="2" opacity=".25"/>
  </g>

  <!-- footer architecture -->
  <g transform="translate(1754 2230)">
    <path d="M-650 0 H-210" stroke="#0f6b5d" stroke-width="2" opacity=".5"/>
    <path d="M210 0 H650" stroke="#0f6b5d" stroke-width="2" opacity=".5"/>
    <path d="M-170 0 H-85" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <path d="M85 0 H170" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-60 0 L0 -30 L60 0 L0 30 Z" fill="#fffdf8" stroke="#c7a842" stroke-width="3"/>
    <circle r="6" fill="#0f6b5d"/>
  </g>

  <!-- bottom seals placeholders -->
  <g transform="translate(390 2160)">
    <circle r="66" fill="#fffdfa" stroke="#c7a842" stroke-width="4"/>
    <circle r="51" fill="none" stroke="#0f6b5d" stroke-width="3" opacity=".8"/>
  </g>

  <g transform="translate(3118 2160)">
    <circle r="66" fill="#fffdfa" stroke="#c7a842" stroke-width="4"/>
    <circle r="51" fill="none" stroke="#0f6b5d" stroke-width="3" opacity=".8"/>
  </g>
</svg>